plugins {
    id 'java'
    id 'maven-publish'
}

def resolvedTsCoreRepo() {
    return project.findProperty('tsCoreRepo')
        ?: System.getenv('TS_CORE_REPO')
        ?: '/workspace/manifasto-ts-core'
}

tasks.register('syncGoldenVectors', Exec) {
    group = 'verification'
    description = 'Sync compiler golden/vector resources from TS core repo'
    workingDir = rootProject.projectDir
    commandLine 'bash', './scripts/sync-golden.sh', resolvedTsCoreRepo()
}

tasks.register('checkGoldenSync', Exec) {
    group = 'verification'
    description = 'Verify compiler vectors are synchronized with TS core repo'
    workingDir = rootProject.projectDir
    commandLine 'bash', './scripts/check-golden-sync.sh', resolvedTsCoreRepo()
}

allprojects {
    group = 'ai.manifesto'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        // JUnit 5 for testing
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
        testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // Maven Publishing Configuration
    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId = project.group
                artifactId = project.name
                version = project.version

                // Default jar is automatically included

                pom {
                    name = project.name
                    description = "Manifesto AI for Java (manifasto4j)"
                    url = 'https://github.com/sh827kim/manifasto4j'

                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'manifesto'
                            name = 'Manifesto Team'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/sh827kim/manifasto4j.git'
                        developerConnection = 'scm:git:ssh://git@github.com/sh827kim/manifasto4j.git'
                        url = 'https://github.com/sh827kim/manifasto4j'
                    }
                }
            }
        }

        repositories {
            // Local Maven Repository (for local testing)
            maven {
                name = 'localRelease'
                url = layout.buildDirectory.dir('repo')
            }
            // Sonatype OSSRH (for Maven Central release)
            maven {
                name = 'sonatype'
                url = uri('https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/')
                credentials {
                    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
            // Sonatype OSSRH snapshots
            maven {
                name = 'sonatypeSnapshots'
                url = uri('https://s01.oss.sonatype.org/content/repositories/snapshots/')
                credentials {
                    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
        }
    }

    signing {
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.mavenJava
        }
    }

    // JAR Configuration
    jar {
        archiveBaseName = project.name
        archiveVersion = version
        manifest {
            attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': version,
                'Created-By': 'Gradle ' + gradle.gradleVersion,
                'Built-On': new Date()
            )
        }
    }
}
