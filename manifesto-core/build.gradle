plugins {
    id 'java'
    id 'maven-publish'
}

dependencies {
    // No external runtime dependencies - pure computation engine
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

// Javadoc configuration (failOnError = false to ignore HTML/tag errors in comments)
javadoc {
    failOnError = false
    options.addStringOption('Xdoclint:none', '-quiet')
}

// sourcesJar/javadocJar tasks are provided by the root subprojects java configuration.

// Publishing Configuration for manifesto-core
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version

            // Default jar is automatically included
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = 'Manifesto Core'
                description = 'Core computation engine for Manifesto LLM Constitution'
                url = 'https://github.com/manifesto-ai/core'

                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'manifesto'
                        name = 'Manifesto Team'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/manifesto-ai/core.git'
                    developerConnection = 'scm:git:ssh://git@github.com/manifesto-ai/core.git'
                    url = 'https://github.com/manifesto-ai/core'
                }
            }
        }
    }

    repositories {
        // Local Maven Repository
        maven {
            name = 'localRelease'
            url = layout.buildDirectory.dir('repo')
        }

        // Commented out: Configure your own Maven repository
        // maven {
        //     name = 'mavencentral'
        //     url = 'https://oss.sonatype.org/service/local/staging/deploy/maven2'
        //     credentials {
        //         username System.getenv('MAVEN_USERNAME')
        //         password System.getenv('MAVEN_PASSWORD')
        //     }
        // }
    }
}
